name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Check generated design tokens are up to date
        run: |
          npm run tokens
          git diff --exit-code -- src/app/loomit-tokens.css

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage gate (90%)
        run: npm run test:coverage

      - name: Build web
        run: npm run build

      - name: Build server
        run: npm run build:server

      - name: Smoke-run migrations, API and worker
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          AUTH_MODE: dev
          DEV_JWT_SECRET: ci-only-secret-ci-only-secret-ci-only
          SECRET_STORE: database
          SECRETS_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          CLASSIFIER_PROVIDER: mock
        run: |
          node dist/server/migrate.js
          node dist/server/api.js & API_PID=$!
          node dist/server/worker.js & WORKER_PID=$!
          for i in $(seq 1 30); do
            curl -sf localhost:8080/readyz && curl -sf localhost:9464/readyz && break
            sleep 1
          done
          curl -sf localhost:8080/readyz
          curl -sf localhost:9464/metrics | grep -q reviewsignal_
          kill $API_PID $WORKER_PID

  deploy-artifacts:
    name: Chart, alert rules and image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Alert rules in the chart match deploy/prometheus
        run: bash deploy/scripts/sync-alerts.sh --check

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint and render the chart (staging and production)
        # The overlays leave OPENROUTER_MODEL empty until the M1 model
        # decision; CI pins a placeholder only to render.
        run: |
          for env in staging production; do
            helm lint deploy/helm/reviewsignal -f deploy/helm/reviewsignal/values-$env.yaml --set config.OPENROUTER_MODEL=ci/placeholder-model
            helm template reviewsignal deploy/helm/reviewsignal -f deploy/helm/reviewsignal/values-$env.yaml --set config.OPENROUTER_MODEL=ci/placeholder-model > rendered-$env.yaml
          done

      - name: Check alert rules with promtool
        run: |
          docker run --rm -v "$PWD/deploy/prometheus:/rules" --entrypoint promtool prom/prometheus:v3.5.0 check rules /rules/alerts.yaml

      - name: Build the image
        run: docker build --build-arg NEXT_PUBLIC_API_URL=https://reviewsignal.example.invalid -t reviewsignal:ci .
