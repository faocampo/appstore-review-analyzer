# Production overlay. Deployed by the Argo CD Application
# "reviewsignal-production" (deploy/argocd/application.yaml) with manual sync.
#
# PLACEHOLDER values (account id 123456789012, *.loomit.example hosts, bucket
# names) must be replaced with the real identifiers from the Loomit platform
# team before the first sync. Empty required values make rendering fail with
# a message naming the value.

image:
  # PLACEHOLDER: production ECR repository.
  repository: 123456789012.dkr.ecr.us-east-1.amazonaws.com/reviewsignal
  # Promoted by pull request: the tag already verified on staging.
  tag: ""

serviceAccount:
  # PLACEHOLDER: IRSA role for production.
  irsaRoleArn: arn:aws:iam::123456789012:role/reviewsignal-production

config:
  NODE_ENV: production
  DATABASE_POOL_MAX: "10"
  AUTH_MODE: oidc
  # PLACEHOLDER: Loomit identity provider (production).
  OIDC_ISSUER: https://auth.loomit.example/
  OIDC_AUDIENCE: reviewsignal-api
  OIDC_JWKS_URL: https://auth.loomit.example/.well-known/jwks.json
  # PLACEHOLDER: Loomit console origin (production).
  CORS_ORIGINS: https://console.loomit.example
  SECRET_STORE: aws
  # ASSUMPTION: region not yet confirmed (see docs/legal/dpa-checklist.md).
  AWS_REGION: us-east-1
  SECRETS_PREFIX: reviewsignal/production/
  UPLOADS_BUCKET: x3m-reviewsignal-production-uploads
  EXPORT_BUCKET: x3m-reviewsignal-production-export
  # PLACEHOLDER: Loomit notification webhook (production).
  LOOMIT_NOTIFY_URL: https://loomit-backend.loomit.example/internal/notifications/reviewsignal
  CLASSIFIER_PROVIDER: openrouter
  # Pinned model chosen at the M1 gate (docs/adr/0005-classifier-providers.md).
  # Rendering fails until it is set.
  OPENROUTER_MODEL: ""
  OPENROUTER_ZDR: "true"

externalSecrets:
  # Runtime secret; deliberately outside SECRETS_PREFIX so the service's IAM
  # role cannot read it.
  remoteKey: reviewsignal-runtime/production
  keys:
    - DATABASE_URL
    - OPENROUTER_API_KEY
    - LOOMIT_NOTIFY_SECRET

api:
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
  resources:
    requests:
      cpu: 500m
      memory: 384Mi
    limits:
      cpu: "1"
      memory: 768Mi

worker:
  replicas: 2
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
