{{- if and .Values.migrations.enabled .Values.externalSecrets.enabled }}
# DATABASE_URL for the migrations job. It is a hook resource, like the job,
# so it exists before the job on the very first sync, when the main
# ExternalSecret has not been applied yet.
apiVersion: {{ .Values.externalSecrets.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "reviewsignal.migrateSecretName" . }}
  labels:
    {{- include "reviewsignal.componentLabels" (list . "migrate") | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-1"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.externalSecrets.secretStoreRef.kind }}
    name: {{ .Values.externalSecrets.secretStoreRef.name }}
  target:
    name: {{ include "reviewsignal.migrateSecretName" . }}
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKey }}
        property: {{ .Values.migrations.databaseUrlProperty }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
{{- end }}
