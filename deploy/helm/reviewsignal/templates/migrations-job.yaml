{{- if .Values.migrations.enabled }}
{{- $m := .Values.migrations }}
# Schema migrations (idempotent, advisory-locked). Runs before the API and
# the worker roll out: as an Argo CD PreSync hook, or as a Helm
# pre-install/pre-upgrade hook when installed with Helm directly. A failed
# job fails the sync, so no new pods start on a schema they do not match.
# The last run is kept until the next sync for inspection.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "reviewsignal.fullname" . }}-migrate
  labels:
    {{- include "reviewsignal.componentLabels" (list . "migrate") | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: {{ $m.backoffLimit }}
  activeDeadlineSeconds: {{ $m.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "reviewsignal.componentLabels" (list . "migrate") | nindent 8 }}
      {{- with $m.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "reviewsignal.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["node", "dist/server/migrate.js"]
          env:
            - name: NODE_ENV
              value: {{ .Values.config.NODE_ENV | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "reviewsignal.migrateSecretName" . }}
                  key: DATABASE_URL
          resources:
            {{- toYaml $m.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.tmpVolume.sizeLimit }}
      {{- with $m.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $m.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
