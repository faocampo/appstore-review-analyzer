apiVersion: v1
kind: Service
metadata:
  name: {{ include "reviewsignal.fullname" . }}-api
  labels:
    {{- include "reviewsignal.componentLabels" (list . "api") | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  selector:
    {{- include "reviewsignal.componentSelectorLabels" (list . "api") | nindent 4 }}
  ports:
    # The "http-" prefix tells Istio the protocol.
    - name: http-api
      port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
