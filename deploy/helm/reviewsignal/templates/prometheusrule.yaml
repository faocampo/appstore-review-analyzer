{{- if .Values.metrics.prometheusRule.enabled }}
{{- $source := .Files.Get "files/alerts.yaml" }}
{{- if not $source }}
{{- fail "files/alerts.yaml is missing; copy deploy/prometheus/alerts.yaml into the chart (deploy/scripts/sync-alerts.sh)" }}
{{- end }}
{{- $rule := fromYaml $source }}
# Generated from deploy/prometheus/alerts.yaml (copied to files/alerts.yaml).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "reviewsignal.fullname" . }}
  labels:
    {{- include "reviewsignal.labels" . | nindent 4 }}
    {{- with .Values.metrics.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- toYaml $rule.spec | nindent 2 }}
{{- end }}
